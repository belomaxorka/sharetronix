name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Short tags are enabled because legacy templates use `<? ... ?>`;
      # without them those sections would be read as plain text.
      # Parse errors fail the job; compile-time deprecations are reported
      # as warnings so that they stay visible without blocking changes.
      - name: Lint tracked PHP files
        shell: bash
        run: |
          annotate() {
            local message=${3//'%'/'%25'}
            message=${message//$'\r'/}
            message=${message//$'\n'/'%0A'}
            echo "::$1 file=$2::$message"
          }

          php -v
          total=0
          failed=0
          while IFS= read -r -d '' file; do
            total=$((total + 1))
            if ! output=$(php -n -d short_open_tag=On -d error_reporting=-1 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1); then
              failed=$((failed + 1))
              annotate error "$file" "$output"
            elif grep -q 'Deprecated:' <<<"$output"; then
              annotate warning "$file" "$output"
            fi
          done < <(git ls-files -z -- '*.php')

          echo "Checked $total PHP files, $failed with syntax errors."
          [ "$total" -gt 0 ] && [ "$failed" -eq 0 ]
